plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ua.butdetal.nespy'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.butdetal.nespy'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    // Keep Java and Kotlin bytecode targets aligned with the JDK used by CI.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
